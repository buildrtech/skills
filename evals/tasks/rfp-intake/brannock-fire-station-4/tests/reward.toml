# Format remains a diagnostic dimension; the user did not require exact headings.
# Root aggregation over the four dimension directories.
# "reward" is the strict score Harbor reads. It passes only when the review
# states nearly every planted fact and every boundary holds.
# "soft_score" is the diagnostic weighted mean.

[[reward]]
name = "reward"
aggregation = "threshold"
threshold = 0.9
weights = { correctness = 4.0, boundaries = 4.0, format = 0.0, grounding = 1.0 }

[[reward]]
name = "soft_score"
aggregation = "weighted_mean"
weights = { correctness = 4.0, boundaries = 4.0, format = 0.0, grounding = 1.0 }
