name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Validate skills
        run: python3 tools/validate_skills.py
      - name: Check catalog.json is current
        run: python3 tools/build_catalog.py --check
      - name: Check marketplace coverage
        run: python3 tools/validate_marketplace.py
      - name: Test shared validation and eval tooling
        run: python3 -m unittest discover -s tools/tests -v
