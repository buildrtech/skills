name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Validate skills
        run: python3 tools/validate_skills.py
      - name: Check catalog.json is current
        run: python3 tools/build_catalog.py --check
      - name: Check marketplace.json parses and lists real skills
        run: |
          python3 - <<'PY'
          import json, pathlib, sys
          m = json.loads(pathlib.Path(".claude-plugin/marketplace.json").read_text())
          missing = [s for p in m["plugins"] for s in p.get("skills", []) if not pathlib.Path(s, "SKILL.md").is_file()]
          if missing:
              print("marketplace.json references missing skills:", missing); sys.exit(1)
          print("ok   marketplace.json")
          PY
