<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
:root {
  --ink: #1d2422; --muted: #5d6865; --line: #dde3e1; --paper: #ffffff; --wash: #f5f7f6;
  --accent: #1f5f4f; --warn: #8a5300; --warn-bg: #fff4e5; --gap: #fbe3df; --plugged: #e6f2ec; --low: #eef7f2;
  font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--ink); background: var(--wash);
}
* { box-sizing: border-box; }
body { margin: 0; }
main { max-width: 1320px; margin: 0 auto; padding: 24px clamp(12px, 3vw, 32px) 48px; }
h1 { font-size: 28px; line-height: 1.15; margin: 4px 0 6px; letter-spacing: -0.01em; }
h2 { font-size: 18px; margin: 0 0 8px; }
h3 { font-size: 15px; margin: 0 0 6px; }
section { background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 18px 20px; margin-top: 16px; }
.eyebrow { margin: 0; color: var(--muted); font-size: 13px; letter-spacing: .02em; }
.summary { margin: 0; color: var(--muted); max-width: 70ch; }
.summary strong { color: var(--ink); }
.top { display: flex; flex-wrap: wrap; gap: 16px; justify-content: space-between; align-items: flex-end; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
button, .file { font: inherit; font-size: 14px; border: 1px solid var(--line); background: var(--paper); color: var(--ink); border-radius: 6px; padding: 7px 12px; min-height: 36px; cursor: pointer; }
button:hover, .file:hover { border-color: var(--accent); }
button.small { min-height: 28px; padding: 2px 10px; font-size: 13px; margin-left: 4px; }
button[type="submit"] { background: var(--accent); border-color: var(--accent); color: #fff; }
button:focus-visible, input:focus-visible, select:focus-visible, a:focus-visible, .file:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
.file input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.file { position: relative; display: inline-flex; align-items: center; }
.status { min-height: 1.5em; margin: 8px 0 0; color: var(--accent); font-size: 14px; }
.hint, .empty { color: var(--muted); font-size: 14px; margin: 0 0 10px; max-width: 80ch; }
.sub { display: block; color: var(--muted); font-size: 12px; font-weight: normal; }
.gap .sub, .plug .sub, .suggest .sub, td .sub.inline, .moves .sub, h2 .sub, h3 .sub, .evidence .sub { display: inline; }
.pill { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--accent); border: 1px solid currentColor; border-radius: 999px; padding: 1px 6px; margin-left: 4px; white-space: nowrap; }
.ref { font: 600 11px/1 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--accent); text-decoration: none; border: 1px solid var(--line); border-radius: 4px; padding: 1px 4px; margin-left: 2px; white-space: nowrap; }
.ref:hover { border-color: var(--accent); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; vertical-align: top; padding: 8px 10px; border-bottom: 1px solid var(--line); }
thead th { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 600; }
tbody th { font-weight: 600; }
.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
td.total { font-weight: 700; }
tr.low { background: var(--low); }
td.ok { color: var(--accent); font-weight: 600; }
td.warn { color: var(--warn); }
td.num.warn { background: var(--warn-bg); }
tr.group th { background: var(--wash); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
.matrix td { font-size: 13px; min-width: 140px; }
.matrix td.cell-gap { background: var(--gap); }
.matrix td.cell-plugged { background: var(--plugged); }
.matrix td.st-included { color: var(--ink); }
.matrix td.st-omitted, .matrix td.st-unknown { font-style: italic; }

.gaps { list-style: none; margin: 0 0 12px; padding: 0; display: grid; gap: 8px; }
.gap { padding: 10px 12px; border: 1px solid var(--line); border-left: 4px solid var(--warn); border-radius: 6px; }
.gap.done { border-left-color: var(--accent); padding: 6px 12px; }
.gap.done .says { font-size: 13px; }
.warn-note { background: var(--warn-bg); border-radius: 6px; padding: 6px 10px; margin: 8px 0 0; color: var(--ink); }
.gap p { margin: 4px 0 0; font-size: 14px; }
.gap .says { color: var(--muted); }
.suggest.none { color: var(--muted); font-style: italic; }
.plug-form { display: grid; grid-template-columns: minmax(110px, 160px) minmax(180px, 1fr) auto; gap: 8px; align-items: end; margin-top: 8px; }
.adj-form { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); margin-top: 12px; }
.plug-form label { display: grid; gap: 2px; font-size: 12px; color: var(--muted); }
.plug-form input, .plug-form select { width: 100%; min-width: 0; font: inherit; font-size: 14px; color: var(--ink); padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; min-height: 36px; background: var(--paper); }
.plug-form.inline { grid-template-columns: 110px minmax(140px, 1fr) auto; margin: 0; text-align: left; }
.moves { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; }
.moves li { display: flex; justify-content: space-between; gap: 12px; align-items: center; padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px; font-size: 14px; }

.basis { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 14px 0 6px; }
.segmented { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; padding: 0; margin: 0; overflow: hidden; }
.seg { position: relative; padding: 5px 10px; font-size: 13px; cursor: pointer; border-right: 1px solid var(--line); }
.seg:last-of-type { border-right: 0; }
.seg input { position: absolute; opacity: 0; inset: 0; cursor: pointer; }
.seg.on { background: var(--accent); color: #fff; }
.seg:focus-within { outline: 2px solid var(--accent); outline-offset: -2px; }
.toggle { display: inline-flex; gap: 6px; align-items: center; font-size: 14px; white-space: nowrap; }
.toggle input { width: 18px; height: 18px; accent-color: var(--accent); }

.bidders { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
.bidder { border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px; }
.flags { margin: 0 0 8px; padding: 8px 12px 8px 28px; background: var(--warn-bg); border-radius: 6px; font-size: 14px; }
.questions { margin: 0; padding-left: 20px; font-size: 14px; }
.questions li + li, .flags li + li { margin-top: 4px; }
.quals { font-size: 14px; padding-left: 20px; }
.evidence { margin: 0; font-size: 13px; }
.evidence div { padding: 6px 0; border-bottom: 1px solid var(--line); scroll-margin-top: 16px; }
.evidence div:target { background: var(--warn-bg); }
.evidence dt { font-weight: 600; }
.evidence dd { margin: 2px 0 0; color: #2b3532; }
.foot { color: var(--muted); font-size: 13px; margin-top: 16px; }
.nojs-note { display: none; }

/* Without JavaScript (for example a sandboxed preview) the tab stays readable but static. */
html:not(.js) .actions, html:not(.js) .plug-form, html:not(.js) button { display: none; }
html:not(.js) .segmented, html:not(.js) .toggle { pointer-events: none; }
html:not(.js) .nojs-note { display: block; background: #eef4f2; border: 1px solid var(--line); border-radius: 6px; padding: 8px 12px; margin-bottom: 12px; font-size: 14px; }

@media (max-width: 640px) {
  .plug-form, .plug-form.inline { grid-template-columns: 1fr; }
}
@media print {
  :root { background: #fff; }
  .actions, .plug-form, button, .status { display: none !important; }
  section { break-inside: avoid; border: 0; padding: 8px 0; }
}
</style>
</head>
<body>
<main>
<p class="nojs-note">Static preview. Open this file in a browser to accept plugs, toggle alternates, carry tax and bond, and export to Excel.</p>
<div id="app">{{APP}}</div>
</main>
<script type="application/json" id="tab-data">{{DATA}}</script>
<script type="application/json" id="tab-scenario">{{SCENARIO}}</script>
<script type="module">
{{SCRIPT}}
</script>
</body>
</html>
